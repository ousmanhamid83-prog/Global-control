# Le script de préparation du poste sur un VRAI Windows (machine neuve de GitHub) : Windows
# PowerShell 5.1, celui livré avec Windows, et PowerShell 7. Étapes sans Docker — build, IA
# (Ollama, plus petit modèle), relief (une petite zone) — puis le serveur construit lancé et
# interrogé, et sa base sur disque (verrou, copie du jour, reprise d'une base abîmée).
# Une seconde machine, sans winget : Ollama par l'installeur officiel, le modèle choisi par le
# script selon la mémoire, puis Docker absent et Docker tel qu'il est ici (conteneurs Windows).
# L'itinéraire, le relais Signal et la recherche demandent Docker Desktop en conteneurs Linux,
# impossible sur ces machines : ils restent essayés sous Linux.
# Relancé aussi quand changent les dépendances ou les scripts que lance « npm run build » : les deux
# premières exécutions y ont trouvé un package-lock.json refusé par « npm ci » et un vite.cmd que
# with-app-env.mjs ne savait pas lancer.
name: Poste sous Windows

on:
  push:
    paths:
      - "scripts/poste/**"
      - "scripts/with-app-env.mjs"
      - "scripts/migrate.mjs"
      - "src/lib/db.ts"
      - "src/lib/base-poste.server.ts"
      - "src/lib/base-poste.test.ts"
      - "src/lib/base-coupure.test.ts"
      - "src/lib/disque-poste.server.ts"
      - "src/lib/disque-poste.test.ts"
      - "src/lib/controle-copies.server.ts"
      - "src/lib/controle-copies.test.ts"
      - "src/lib/disque-physique.server.ts"
      - "src/lib/disque-physique.test.ts"
      - "src/lib/empreintes-poste.server.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/poste-windows.yml"
  workflow_dispatch:

# Un nouvel envoi sur la même branche annule l'essai encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preparer:
    name: preparer-poste.ps1 · ${{ matrix.ps }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ps: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Machine et PowerShell
        shell: cmd
        run: |
          ver
          ${{ matrix.ps }} -NoProfile -Command "'PowerShell ' + $PSVersionTable.PSVersion.ToString() + ' (' + $PSVersionTable.PSEdition + ')'"

      - name: Préparer le poste (build, IA, relief)
        shell: cmd
        run: ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File scripts\poste\preparer-poste.ps1 -Modele qwen2.5:0.5b -Zone "12,13,15,16"

      - name: poste.env écrit par le script
        shell: cmd
        run: type poste.env

      # Un récepteur 1090 qui écoute (trames brutes sur 30002), une phonie qui ne répond pas : le
      # script règle les deux dans poste.env, essaie chacun, le dit ; une position fausse est refusée.
      - name: Antenne 1090 et phonie ATC — réglées, essayées, dites ; une position fausse refusée
        shell: pwsh
        run: |
          $recepteur = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 30002)
          $recepteur.Start()
          $sortie = & ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File scripts\poste\preparer-poste.ps1 -SansBuild -SansIA -SansRelief -Antenne "37.5,14.0" -Phonie "http://127.0.0.1:9/atc.mp3"
          $recepteur.Stop()
          $texte = $sortie -join "`n"
          $texte
          if ($texte -notmatch "antenne 1090 : r.cepteur sur 127\.0\.0\.1:30002, antenne . 37\.5,14\.0") { throw "récepteur 1090 qui écoute : pas vu" }
          if ($texte -notmatch "Phonie ATC : http://127\.0\.0\.1:9/atc\.mp3 ne r.pond pas encore") { throw "phonie muette : rien de dit" }
          $env = Get-Content poste.env -Raw
          foreach ($l in "AFRICONTROL_1090=127.0.0.1:30002", "AFRICONTROL_ANTENNE=37.5,14.0", "AFRICONTROL_ATC=http://127.0.0.1:9/atc.mp3") {
            if ($env -notmatch [regex]::Escape($l)) { throw "$l manque dans poste.env" }
          }
          & ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File scripts\poste\preparer-poste.ps1 -SansBuild -SansIA -SansRelief -Antenne "95,14" | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "une position fausse doit faire échouer le bilan ($LASTEXITCODE)" }
          if ((Get-Content poste.env -Raw) -notmatch "AFRICONTROL_ANTENNE=37\.5,14\.0") { throw "le réglage d'avant doit rester" }
          Write-Host "Antenne et phonie : réglées, essayées, dites ; position fausse refusée."

      # Le script choisit seul un autre disque INTERNE pour les copies : ici, le poste est sur D:
      # (le disque temporaire du runner) et C: (le disque du système) est un autre disque.
      - name: Copies du poste sur un autre disque que le sien
        shell: pwsh
        run: |
          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystem, DriveType, SizeRemaining, Size
          Get-Disk | Format-Table Number, FriendlyName, BusType, Size
          $reglage = Select-String -Path poste.env -Pattern "^AFRICONTROL_COPIES=(.+)$" | Select-Object -First 1
          if (-not $reglage) { Write-Host "AFRICONTROL_COPIES absent de poste.env : pas d'autre disque trouvé"; exit 1 }
          $copies = $reglage.Matches[0].Groups[1].Value
          $poste = (Get-Partition -DriveLetter (Get-Location).Path.Substring(0, 1)).DiskNumber
          $leur = (Get-Partition -DriveLetter $copies.Substring(0, 1)).DiskNumber
          if ($poste -eq $leur) { Write-Host "copies sur le disque du poste ($poste)"; exit 1 }
          if (-not (Test-Path $copies -PathType Container)) { Write-Host "$copies pas créé"; exit 1 }
          Write-Host "Copies dans $copies (disque $leur) ; poste sur le disque $poste."
          # Le serveur, lui, reconnaît-il les mêmes disques physiques (CIM) ? C'est ce que montre la
          # Division : le même disque y est signalé, deux partitions d'un disque comprises.
          $vus = node --experimental-strip-types --no-warnings --input-type=module -e "const m = await import('./src/lib/disque-physique.server.ts'); console.log(JSON.stringify([await m.disquesPhysiques(process.cwd()), await m.disquesPhysiques(process.argv[1])]))" -- $copies
          Write-Host "Disques vus par le serveur (poste, copies) : $vus"
          $d = $vus | ConvertFrom-Json
          if (-not ($d[0] -contains [string]$poste) -or -not ($d[1] -contains [string]$leur)) { Write-Host "le serveur ne voit pas les mêmes disques"; exit 1 }

      # fsync (Windows refuse de forcer un fichier ouvert en lecture seule), coupure de courant
      # simulée, écritures doublées, copies et reprise : les tests de la base et des registres,
      # sous Windows.
      - name: Base du poste, tests sous Windows (fsync, coupure simulée, copies, reprise)
        if: matrix.ps == 'powershell'
        shell: cmd
        run: node --experimental-strip-types --test src/lib/base-poste.test.ts src/lib/base-coupure.test.ts src/lib/disque-poste.test.ts src/lib/controle-copies.test.ts src/lib/disque-physique.test.ts

      - name: Le serveur construit démarre, lit poste.env et répond
        shell: pwsh
        run: |
          $env:PORT = "8080"
          $p = Start-Process node -ArgumentList ".output\server\index.mjs" -PassThru -NoNewWindow `
            -RedirectStandardOutput serveur.log -RedirectStandardError serveur-erreurs.log
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8080/" -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force
          Get-Content serveur.log -TotalCount 30
          if (-not $ok) { Get-Content serveur-erreurs.log; exit 1 }
          if (-not (Select-String -Path serveur.log -Pattern "poste.env" -Quiet)) {
            Write-Host "Le serveur n'a pas écrit qu'il lisait poste.env."
            exit 1
          }
          Write-Host "Serveur construit : HTTP 200 sur http://127.0.0.1:8080/, poste.env lu."

      # Le verrou de la base est ce qui dépend le plus du système : process.kill(pid, 0), le témoin
      # sur 127.0.0.1, les fichiers. Le serveur de l'étape précédente, arrêté net, a laissé le sien.
      - name: Base du poste sur disque, un seul serveur, reprise après un arrêt brutal
        shell: pwsh
        run: |
          function Lancer($port, $nom) {
            $env:PORT = "$port"
            Start-Process node -ArgumentList ".output\server\index.mjs" -PassThru -NoNewWindow `
              -RedirectStandardOutput "$nom.out" -RedirectStandardError "$nom.err"
          }
          function Pret($port) {
            for ($i = 0; $i -lt 90; $i++) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/" -TimeoutSec 30
                if ($r.StatusCode -eq 200) { return $true }
              } catch {}
              Start-Sleep -Seconds 1
            }
            return $false
          }
          function Ligne($nom, $motif) {
            for ($i = 0; $i -lt 40; $i++) {
              $l = Select-String -Path "$nom.out", "$nom.err" -Pattern $motif -SimpleMatch -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($l) { return $l.Line }
              Start-Sleep -Seconds 1
            }
            Get-Content "$nom.out", "$nom.err"
            throw "$nom : « $motif » jamais écrit"
          }
          $verrouLaisse = Test-Path data\base.verrou
          $a = Lancer 8081 "a"
          if (-not (Pret 8081)) { Get-Content a.err; exit 1 }
          Write-Host "1. verrou laissé par l'arrêt net précédent : $verrouLaisse ; repris : $(Ligne 'a' '[base] sur disque')"
          if (-not (Test-Path data\base.verrou)) { Write-Host "pas de verrou posé"; exit 1 }
          # La copie du jour, à chaud : faite au premier démarrage sur disque (étape précédente) ou,
          # s'il a été arrêté net pendant, par celui-ci. Attendue par sa ligne au journal du serveur :
          # son étiquette est écrite avant la fin, dans jour-….part. Les écritures doublées à côté.
          $s = $null
          for ($i = 0; $i -lt 60 -and -not $s; $i++) {
            $s = Select-String -Path serveur.log, a.out -Pattern "[base] copie du jour faite" -SimpleMatch -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $s) { Start-Sleep -Seconds 1 }
          }
          if (-not $s) { Get-Content serveur.log, a.out, a.err; Write-Host "pas de copie du jour"; exit 1 }
          # Les copies sont là où le script les a mises : un autre disque que le poste s'il en a
          # trouvé un (ici, le poste est sur D: et C: est un autre disque), sinon data\copies.
          $reglage = Select-String -Path poste.env -Pattern "^AFRICONTROL_COPIES=(.+)$" | Select-Object -First 1
          $copies = if ($reglage) { $reglage.Matches[0].Groups[1].Value } else { "data\copies" }
          $jour = @(Get-ChildItem $copies -Directory -Filter "jour-*" |
            Where-Object { $_.Name -notlike "*.part" -and (Test-Path (Join-Path $_.FullName "base\backup_label")) })
          if ($jour.Count -ne 1) { Get-ChildItem $copies; Write-Host "copie du jour introuvable dans $copies"; exit 1 }
          if (-not (Test-Path (Join-Path $copies "ecritures\*"))) { Get-ChildItem -Recurse $copies; Write-Host "pas d'écritures doublées"; exit 1 }
          Write-Host "   copie du jour : $($s.Line)"
          $b = Lancer 8082 "b"
          if (-not (Pret 8082)) { Get-Content b.err; exit 1 }
          Write-Host "2. second serveur, même dossier : $(Ligne 'b' '[base] EN M')"
          Stop-Process -Id $b.Id, $a.Id -Force
          Wait-Process -Id $b.Id, $a.Id -ErrorAction SilentlyContinue
          $c = Lancer 8081 "c"
          if (-not (Pret 8081)) { Get-Content c.err; exit 1 }
          Write-Host "3. relancé après un arrêt net : $(Ligne 'c' '[base] sur disque')"
          Stop-Process -Id $c.Id -Force
          Wait-Process -Id $c.Id -ErrorAction SilentlyContinue
          if (Select-String -Path "c.out", "c.err" -Pattern "[base] EN M" -SimpleMatch -Quiet) { exit 1 }
          # Base abîmée (le fichier de contrôle de Postgres effacé) : mise de côté, copie du jour reprise
          # avec les écritures doublées qui l'ont suivie.
          # Sous Windows, la mettre de côté demande que PGLite ait relâché ses fichiers.
          Remove-Item data\base\global\pg_control
          $d = Lancer 8081 "d"
          if (-not (Pret 8081)) { Get-Content d.err; exit 1 }
          Write-Host "4. base abîmée, relancé : $(Ligne 'd' 'reprise de la copie')"
          $cote = @(Get-ChildItem data -Directory -Filter "base.illisible-*")
          Stop-Process -Id $d.Id -Force
          if ($cote.Count -ne 1 -or -not (Test-Path (Join-Path $cote[0].FullName "PG_VERSION"))) { Get-ChildItem data; exit 1 }
          Write-Host "   la base abîmée, gardée telle quelle : data\$($cote[0].Name)"
          if (Select-String -Path "d.out", "d.err" -Pattern "[base] EN M" -SimpleMatch -Quiet) { exit 1 }
          Get-ChildItem data | Format-Table Name, Length

  sans-winget:
    name: sans winget · modèle selon la mémoire · Docker
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # winget est sur ces machines : sans lui, le script prend l'installeur officiel d'Ollama,
      # jamais essayé jusqu'ici. Le PATH sans winget vaut pour les étapes suivantes.
      - name: Cacher winget
        shell: pwsh
        run: |
          $chemin = $env:Path
          for ($i = 0; $i -lt 5; $i++) {
            $w = Get-Command winget -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $w) { break }
            $dossier = (Split-Path $w.Source).TrimEnd('\')
            Write-Host "winget caché : $($w.Source)"
            $chemin = (($chemin -split ';') | Where-Object { $_ -and $_.TrimEnd('\') -ne $dossier }) -join ';'
            $env:Path = $chemin
          }
          if (Get-Command winget -ErrorAction SilentlyContinue) { Write-Host "winget toujours là"; exit 1 }
          "PATH=$chemin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Sans -Modele : le script lit la mémoire de la machine et choisit le modèle (7b dès 15 Go).
      # Sortie au journal au fil de l'eau, et gardée : le premier essai, sortie dans un fichier, est
      # resté muet plus de 14 minutes sur cette étape (7 pour une installation normale) — le script
      # attendait aussi l'application d'Ollama que lance l'installeur. Un blocage échoue ici en
      # 20 minutes, pas en 60.
      - name: IA seule, sans winget, modèle laissé au script
        timeout-minutes: 20
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) { Write-Host "winget visible"; exit 1 }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\poste\preparer-poste.ps1 -SansBuild -SansRelief 2>&1 |
            Tee-Object -FilePath prep-ia.log
          exit $LASTEXITCODE

      - name: Installeur officiel pris, modèle selon la mémoire, première réponse
        shell: pwsh
        run: |
          $log = Get-Content prep-ia.log -Raw
          if ($log -notmatch "installeur officiel d'ollama\.com") { Write-Host "le repli sans winget n'a pas servi"; exit 1 }
          $memoire = [Math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          $attendu = if ($memoire -ge 15) { "qwen2.5:7b" } elseif ($memoire -ge 7) { "qwen2.5:3b" } else { "qwen2.5:1.5b" }
          $choisi = (Select-String -Path poste.env -Pattern "^AFRICONTROL_IA_MODELE=(.+)$").Matches[0].Groups[1].Value
          $temps = [regex]::Match($log, "pond en (\d+) s").Groups[1].Value
          Write-Host "mémoire : $memoire Go ; modèle choisi par le script : $choisi (attendu : $attendu) ; première réponse en $temps s"
          if ($choisi -ne $attendu -or -not $temps) { exit 1 }

      # Docker caché, puis Docker tel qu'il est sur ces machines (conteneurs Windows, quand il y
      # est et tourne) : le script doit dire pourquoi, sans tenter un téléchargement voué à l'échec.
      - name: Docker absent, puis tel qu'il est ici — le script dit pourquoi
        if: success() || failure()
        shell: pwsh
        run: |
          function Essai($nom) {
            $p = Start-Process powershell -Wait -PassThru -NoNewWindow `
              -ArgumentList "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts\poste\preparer-poste.ps1",
                "-SansBuild", "-SansIA", "-SansRelief", "-Itineraire", "-Signal", "-Recherche" `
              -RedirectStandardOutput "$nom.out" -RedirectStandardError "$nom.err"
            $sortie = Get-Content "$nom.out" -Raw
            Write-Host "---- $nom (code $($p.ExitCode))"
            Write-Host $sortie
            return @{ code = $p.ExitCode; sortie = $sortie }
          }
          function Verifier($r, $motif) {
            $n = ([regex]::Matches($r.sortie, [regex]::Escape($motif))).Count
            if ($r.code -ne 1 -or $n -lt 3) { Write-Host "attendu : code 1 et « $motif » pour les trois (code $($r.code), $n fois)"; exit 1 }
            if ($r.sortie -match "pas pu .tre t.l.charg") { Write-Host "un téléchargement a été tenté"; exit 1 }
          }
          $vrai = $env:Path
          $docker = Get-Command docker -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($docker) {
            $dossier = (Split-Path $docker.Source).TrimEnd('\')
            $env:Path = (($vrai -split ';') | Where-Object { $_ -and $_.TrimEnd('\') -ne $dossier }) -join ';'
          }
          Verifier (Essai "sans-docker") "Docker Desktop absent"
          $env:Path = $vrai
          if (-not $docker) { Write-Host "Pas de Docker sur cette machine : seul le cas « absent » est essayé."; exit 0 }
          $systeme = (& docker info --format "{{.OSType}}" 2> $null | Out-String).Trim()
          $code = $LASTEXITCODE
          Write-Host "Docker de cette machine : $($docker.Source) ; docker info : code $code, conteneurs « $systeme »"
          if ($code -ne 0) { Verifier (Essai "docker-arrete") "Docker Desktop arr" }
          elseif ($systeme -ne "linux") { Verifier (Essai "docker-windows") "conteneurs Windows" }
          else { Write-Host "Docker en conteneurs Linux ici : inattendu sur ces machines, rien de plus à essayer." }
