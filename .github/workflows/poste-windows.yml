# Le script de préparation du poste sur un VRAI Windows (machine neuve de GitHub) : Windows
# PowerShell 5.1, celui livré avec Windows, et PowerShell 7. Étapes sans Docker — build, IA
# (Ollama, plus petit modèle), relief (une petite zone) — puis le serveur construit lancé et
# interrogé. L'itinéraire, le relais Signal et la recherche demandent Docker Desktop, absent de
# ces machines : ils restent essayés sous Linux.
# Relancé aussi quand les dépendances changent : le script commence par « npm ci », qui refuse un
# package-lock.json désynchronisé — c'est ce que la première exécution a trouvé.
name: Poste sous Windows

on:
  push:
    paths:
      - "scripts/poste/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/poste-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparer:
    name: preparer-poste.ps1 · ${{ matrix.ps }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ps: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Machine et PowerShell
        shell: cmd
        run: |
          ver
          ${{ matrix.ps }} -NoProfile -Command "'PowerShell ' + $PSVersionTable.PSVersion.ToString() + ' (' + $PSVersionTable.PSEdition + ')'"

      - name: Préparer le poste (build, IA, relief)
        shell: cmd
        run: ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File scripts\poste\preparer-poste.ps1 -Modele qwen2.5:0.5b -Zone "12,13,15,16"

      - name: poste.env écrit par le script
        shell: cmd
        run: type poste.env

      - name: Le serveur construit démarre, lit poste.env et répond
        shell: pwsh
        run: |
          $env:PORT = "8080"
          $p = Start-Process node -ArgumentList ".output\server\index.mjs" -PassThru -NoNewWindow `
            -RedirectStandardOutput serveur.log -RedirectStandardError serveur-erreurs.log
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8080/" -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force
          Get-Content serveur.log -TotalCount 30
          if (-not $ok) { Get-Content serveur-erreurs.log; exit 1 }
          if (-not (Select-String -Path serveur.log -Pattern "poste.env" -Quiet)) {
            Write-Host "Le serveur n'a pas écrit qu'il lisait poste.env."
            exit 1
          }
          Write-Host "Serveur construit : HTTP 200 sur http://127.0.0.1:8080/, poste.env lu."
