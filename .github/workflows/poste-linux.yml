# Le script de préparation du poste sur une VRAIE machine Linux (GitHub, Ubuntu), lancé par un
# compte qui n'est pas root (runner) mais a sudo, comme un opérateur. Ces machines n'ont qu'un
# disque (leur « / ») : le script ne doit rien inventer, et le dire. Puis, montés par le système (à
# root) : une mémoire vive (zram) et deux disques loop, des fichiers image posés sur ce même disque
# (l'un partitionné). Aucun n'est un autre disque : rien n'est choisi seul ; forcés par --copies, le
# script dit « mémoire vive » ou « même disque » (celui de leur image), le serveur aussi. Le dossier
# des copies y est créé par sudo puis rendu au seul compte (700) ; disparu, recréé de même au
# relancement. Un compte sans droit sudo : le refus dit, rien de créé. Script et serveur disent les
# mêmes disques pour chaque montage de la machine. Le code de sortie du script compte.
name: Poste sous Linux

on:
  push:
    paths:
      - "scripts/poste/preparer-poste.sh"
      - "scripts/poste/preparer-poste.test.mjs"
      - "scripts/poste/phonie-vhf.mjs"
      - "scripts/poste/phonie-vhf.test.mjs"
      - "src/lib/disque-physique.server.ts"
      - "src/lib/disque-physique.test.ts"
      - "src/lib/disque-poste.server.ts"
      - ".github/workflows/poste-linux.yml"
  workflow_dispatch:

# Un nouvel envoi sur la même branche annule l'essai encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  copies:
    name: copies sur l'autre disque, par sudo, compte non root
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Machine et disques
        run: |
          id
          lsblk -o NAME,TYPE,RM,TRAN,SIZE,FSTYPE,MOUNTPOINTS
          findmnt -no SOURCE,MAJ:MIN,FSTYPE -T "$PWD"
          df -h "$PWD"

      - name: Un seul disque — rien d'autre à choisir, les copies restent sur le poste, et c'est dit
        run: |
          set -o pipefail
          test "$(id -u)" != 0
          avant=$(id -nG "$(id -un)")
          bash scripts/poste/preparer-poste.sh --sans-build --sans-ia --sans-relief | tee seul.txt
          grep -F "copies du poste dans data/copies (défaut)" seul.txt
          grep -F "Copies du poste sur le même disque que lui (" seul.txt
          if grep -s "^AFRICONTROL_COPIES=" poste.env; then exit 1; fi
          # Le port série de la radio d'un drone : le compte mis dans le groupe dialout, par sudo.
          case " $avant " in
            *" dialout "*) echo "déjà dans le groupe dialout" ;;
            *) grep -F "ports série (radio de télémétrie des drones) : $(id -un) ajouté au groupe dialout" seul.txt ;;
          esac
          id -nG "$(id -un)" | tr ' ' '\n' | grep -qx dialout

      # Comme des disques montés par le système : leurs points de montage appartiennent à root.
      - name: Une mémoire vive (zram de 12 Go) et deux disques loop (images sur le disque de la machine), montés à root
        run: |
          [ -e /sys/class/zram-control ] || sudo modprobe zram || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe zram; }
          dev=$(sudo zramctl --find --size 12G)
          sudo mkfs.ext4 -q "$dev"
          sudo mkdir -p /srv/zram /srv/disque-loop /srv/loop-parts
          sudo mount "$dev" /srv/zram
          # 12 Go, creux : assez de place pour être candidat. Son image : sur le disque de la machine.
          sudo truncate -s 12G /var/lib/disque-loop.img
          sudo mkfs.ext4 -q -F /var/lib/disque-loop.img
          sudo mount -o loop /var/lib/disque-loop.img /srv/disque-loop
          # Un loop partitionné (table DOS, une partition Linux).
          sudo truncate -s 64M /var/lib/loop-parts.img
          echo ',,L' | sudo sfdisk -q /var/lib/loop-parts.img
          boucle=$(sudo losetup -fP --show /var/lib/loop-parts.img)
          sudo udevadm settle
          sudo mkfs.ext4 -q "${boucle}p1"
          sudo mount "${boucle}p1" /srv/loop-parts
          lsblk -o NAME,TYPE,SIZE,MOUNTPOINTS
          losetup -a
          ls -ld /srv/zram /srv/disque-loop /srv/loop-parts

      - name: Ni la mémoire vive ni les loops ne sont choisis — les copies restent sur le poste, et c'est dit
        run: |
          set -o pipefail
          bash scripts/poste/preparer-poste.sh --sans-build --sans-ia --sans-relief | tee aucun.txt
          if grep -F "dialout" aucun.txt; then exit 1; fi # déjà dans le groupe : rien à refaire
          grep -F "copies du poste dans data/copies (défaut)" aucun.txt
          grep -F "Copies du poste sur le même disque que lui (" aucun.txt
          if grep -F "choisi seul" aucun.txt; then exit 1; fi
          if grep -s "^AFRICONTROL_COPIES=" poste.env; then exit 1; fi

      - name: --copies en mémoire vive (zram) — dossier créé par sudo, et dit en mémoire vive
        run: |
          set -o pipefail
          bash scripts/poste/preparer-poste.sh --sans-build --sans-ia --sans-relief --copies /srv/zram/AfriControl-copies | tee vive.txt
          grep -F "dossier des copies créé par sudo sur /srv/zram (à root), rendu à $(id -un) seul" vive.txt
          grep -E "Copies du poste en mémoire vive \(zram[0-9]+\) : un arrêt ou une coupure de courant les effacerait" vive.txt

      - name: --copies sur un loop — dossier créé par sudo, rendu au seul compte ; dit sur le disque du poste, celui de son image
        run: |
          set -o pipefail
          bash scripts/poste/preparer-poste.sh --sans-build --sans-ia --sans-relief --copies /srv/loop-parts/AfriControl-copies | tee parts.txt
          grep -F "Copies du poste sur le même disque que lui (" parts.txt
          bash scripts/poste/preparer-poste.sh --sans-build --sans-ia --sans-relief --copies /srv/disque-loop/AfriControl-copies | tee loop.txt
          grep -F "dossier des copies créé par sudo sur /srv/disque-loop (à root), rendu à $(id -un) seul" loop.txt
          grep -F "Copies du poste sur le même disque que lui (" loop.txt
          grep -Fx "AFRICONTROL_COPIES=/srv/disque-loop/AfriControl-copies" poste.env
          test "$(stat -c '%U %a' /srv/disque-loop/AfriControl-copies)" = "$(id -un) 700"
          touch /srv/disque-loop/AfriControl-copies/ecrit

      - name: Le serveur — chaque loop a le disque de son image (celui du poste), la mémoire vive se reconnaît
        run: |
          node --experimental-strip-types --no-warnings --input-type=module -e '
            const { disquesPhysiques, enMemoireVive } = await import("./src/lib/disque-physique.server.ts");
            const { placeDisques } = await import("./src/lib/disque-poste.server.ts");
            const chemins = { poste: "data", loop: "/srv/disque-loop/AfriControl-copies", partitionne: "/srv/loop-parts", zram: "/srv/zram", shm: "/dev/shm" };
            const vus = {};
            for (const [nom, d] of Object.entries(chemins)) vus[nom] = await disquesPhysiques(d);
            console.log("Disques vus par le serveur :", JSON.stringify(vus));
            const meme = (a, b) => JSON.stringify(a) === JSON.stringify(b);
            if (!vus.poste?.length || enMemoireVive(vus.poste)) process.exit(1);
            if (!meme(vus.loop, vus.poste) || !meme(vus.partitionne, vus.poste)) process.exit(1);
            if (!enMemoireVive(vus.zram) || !meme(vus.shm, ["tmpfs"])) process.exit(1);
            process.env.AFRICONTROL_COPIES = "/srv/disque-loop/AfriControl-copies";
            const loop = await placeDisques();
            process.env.AFRICONTROL_COPIES = "/srv/zram";
            const vive = await placeDisques();
            console.log("Division (même disque, mémoire vive) :", JSON.stringify({ loop: [loop.memeDisque, loop.memoireVive], zram: [vive.memeDisque, vive.memoireVive] }));
            if (!loop.memeDisque || loop.memoireVive.copies || vive.memeDisque || !vive.memoireVive.copies) process.exit(1);
          '

      - name: Un compte sans droit sudo — le refus dit, rien de créé
        run: |
          sudo useradd -m sansudo
          sudo rm -rf /srv/disque-loop/AfriControl-copies
          sudo cp -r "$PWD" /home/sansudo/poste
          sudo rm -rf /home/sansudo/poste/poste.env /home/sansudo/poste/data
          sudo chown -R sansudo: /home/sansudo/poste
          code=0
          sudo -u sansudo env PATH="$PATH" bash -c 'cd /home/sansudo/poste && bash scripts/poste/preparer-poste.sh --sans-build --sans-ia --sans-relief --copies /srv/disque-loop/AfriControl-copies' < /dev/null > refus.txt 2>&1 || code=$?
          cat refus.txt
          test "$code" = 1
          grep -F "✗ copies : /srv/disque-loop/AfriControl-copies impossible à créer, même par sudo" refus.txt
          grep -F "Radio de télémétrie des drones : sudo usermod -aG dialout sansudo, puis nouvelle session" refus.txt
          test ! -e /srv/disque-loop/AfriControl-copies

      - name: Le dossier réglé a disparu (disque remplacé, remonté à root) — recréé par sudo au relancement
        run: |
          set -o pipefail
          bash scripts/poste/preparer-poste.sh --sans-build --sans-ia --sans-relief | tee relance.txt
          grep -F "AFRICONTROL_COPIES déjà réglé dans poste.env (/srv/disque-loop/AfriControl-copies), gardé" relance.txt
          grep -F "dossier des copies créé par sudo sur /srv/disque-loop (à root), rendu à $(id -un) seul" relance.txt
          test "$(stat -c '%U %a' /srv/disque-loop/AfriControl-copies)" = "$(id -un) 700"

      # Pas de clé radio sur cette machine : le récepteur est installé par sudo, réglé, mis au
      # démarrage ; le script dit qu'aucune clé n'est branchée et que rien n'écoute encore.
      - name: Antenne 1090 — le récepteur installé par sudo, réglé sur sa position, poste.env réglé
        run: |
          set -o pipefail
          bash scripts/poste/preparer-poste.sh --sans-build --sans-ia --sans-relief --antenne 12.1331,15.0339 | tee antenne.txt
          grep -Fx 'LAT="12.1331"' /etc/default/dump1090-mutability
          grep -Fx 'LON="15.0339"' /etc/default/dump1090-mutability
          grep -Fx 'RAW_OUTPUT_PORT="30002"' /etc/default/dump1090-mutability
          grep -Fx 'NET_BIND_ADDRESS="127.0.0.1"' /etc/default/dump1090-mutability
          grep -Fx "blacklist dvb_usb_rtl28xxu" /etc/modprobe.d/africontrol-rtl-sdr.conf
          grep -Fx "AFRICONTROL_1090=127.0.0.1:30002" poste.env
          grep -Fx "AFRICONTROL_ANTENNE=12.1331,15.0339" poste.env
          grep -F "aucune clé radio RTL-SDR vue" antenne.txt

      # Le vrai signal 1090 MHz : l'enregistrement d'une clé RTL-SDR livré avec le dump1090 d'origine,
      # rééchantillonné à 2,4 MS/s (la cadence à laquelle le paquet règle la clé), lu par le paquet
      # d'Ubuntu lancé par systemd tel que le script le règle — seule différence avec un poste : il lit
      # ce fichier au lieu de la clé USB. Le script doit compter les trames entendues de 4D2023.
      - name: Vrai signal 1090 MHz décodé par le paquet d'Ubuntu (systemd), trames comptées par le script
        run: |
          set -o pipefail
          curl -sSfL -o modes1.bin https://raw.githubusercontent.com/antirez/dump1090/master/testfiles/modes1.bin
          python3 -m venv /tmp/signal
          /tmp/signal/bin/pip install --quiet numpy scipy
          /tmp/signal/bin/python - modes1.bin modes1-2m4.bin <<'PY'
          import sys
          import numpy as np
          from scipy.signal import resample_poly
          brut = np.fromfile(sys.argv[1], dtype=np.uint8).astype(np.float64)
          y = resample_poly((brut[0::2] - 127.5) + 1j * (brut[1::2] - 127.5), 6, 5)
          s = np.empty(2 * len(y))
          s[0::2], s[1::2] = y.real, y.imag
          np.clip(np.round(s + 127.5), 0, 255).astype(np.uint8).tofile(sys.argv[2])
          PY
          sudo install -d -o dump1090 /run/afri-iq
          sudo mkfifo -m 644 /run/afri-iq/iq
          sudo chown "$(id -un)" /run/afri-iq/iq
          (while true; do cat modes1-2m4.bin; sleep 1; done > /run/afri-iq/iq) &
          sudo sed -i 's#^EXTRA_ARGS=.*#EXTRA_ARGS="--ifile /run/afri-iq/iq --throttle"#' /etc/default/dump1090-mutability
          bash scripts/poste/preparer-poste.sh --sans-build --sans-ia --sans-relief --antenne 37.5,14.0 | tee signal.txt
          grep -E "✓ antenne 1090 : [0-9]+ trame\(s\) brute\(s\) reçue\(s\) de 127\.0\.0\.1:30002" signal.txt
          systemctl is-active dump1090-mutability
          { timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/30002 && cat <&3' || true; } | grep -m 1 '^\*8D4D2023'

      # La phonie reçue par le poste : rtl-sdr et lame installés par apt, le pont lancé par systemd
      # tel que le script le règle. Pas de clé radio ici : le vrai rtl_fm le dit, le pont le répète
      # sur /etat, le script le met au bilan — et le service reste en place pour la clé.
      - name: Phonie reçue par le poste — paquets, service systemd, sans clé radio ici
        run: |
          set -o pipefail
          bash scripts/poste/preparer-poste.sh --sans-build --sans-ia --sans-relief --phonie-radio 118.1 | tee phonie.txt
          grep -F 'Phonie : aucune clé radio RTL-SDR vue (No supported devices found.)' phonie.txt
          grep -Fx "AFRICONTROL_ATC=http://127.0.0.1:8001/phonie.mp3" poste.env
          systemctl is-active africontrol-phonie
          grep -F '"--frequence" "118.1" "--cle" "0" "--port" "8001"' /etc/systemd/system/africontrol-phonie.service
          curl -s http://127.0.0.1:8001/etat | tee etat.json
          grep -F '"erreur":"No supported devices found."' etat.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/phonie.mp3)" = 503
          ! curl -s -m 2 "http://$(hostname -I | cut -d' ' -f1):8001/etat"

      # Avec la mémoire vive, les loops et les snaps de la machine montés : script et serveur doivent
      # dire les mêmes disques pour chacun de ses montages.
      - name: Tests des scripts
        run: |
          node --test scripts/poste/preparer-poste.test.mjs
          node --test scripts/poste/phonie-vhf.test.mjs
          node --experimental-strip-types --no-warnings --test src/lib/disque-physique.test.ts
